# ===== 站点基础 =====
baseURL = "https://example.com/"
title = "Dooz Demo"
theme = "hugo-theme-dooz"
locale = "zh-CN"
defaultContentLanguage = "zh"
hasCJKLanguage = true
enableEmoji = true
copyright = "MIT Licensed"

# 分页
[pagination]
  pagerSize = 10

# 首页生成 JSON，供主题内置搜索使用
[outputs]
  home = ["HTML", "RSS", "JSON"]

# ===== 主题参数 =====
[params]
  # 作者信息：替换成你自己的信息即可
  author = "示例作者"
  email = "hello@example.com"
  city = "示例城市"
  avatar = "img/res/avatar.svg"
  aphorism = "写代码，也写生活。"

  # 站点 Logo：文字和字体都可以在这里配置
  logoText = "Dooz"
  logoFontFamily = '"Fraunces", "Bodoni 72", Didot, Georgia, "Times New Roman", serif'
  logoFontWeight = 700
  # 可选：引入在线字体；留空则使用系统字体
  logoFontUrl = ""

  # 社交链接：不需要的留空或删除即可
  github = "https://github.com/example"
  csdn = "https://blog.csdn.net/example"
  cnblog = "https://www.cnblogs.com/example/"
  # 微信二维码是可选能力；示例站不放置二维码
  # wechat = "img/wechat.png"

  # 主题仓库地址，用于导航栏的 GitHub 按钮
  repo = "https://github.com/yourname/hugo-theme-dooz"

  # 公告（支持 Markdown）
  noticeEnable = true
  notice = "**[Dooz](https://github.com/yourname/hugo-theme-dooz)** 是一个为程序员和写作者准备的 Hugo 主题。"

  # 首页 Hero 与文案
  hero = "img/res/hero.jpg"
  slogan = "简单、克制，适合长期写作。"
  timeOfMonth = "2006年1月"
  timeOfDay = "2006年1月2日"

  # 分享按钮
  openShare = true

  # 页脚
  footerTagline = "代码是手艺，笔记是章法。"

  # SEO
  homeTitle = "Dooz · 程序员博客主题"
  keywords = "Hugo,主题,博客,程序员,静态站点"
  description = "Dooz 是一个简洁优雅的 Hugo 主题，内置搜索、代码块工具条、文章目录和响应式布局。"

# 固定链接
[permalinks]
  post = "/:year/:month/:title"

# 分类体系
[taxonomies]
  tag = "tags"
  category = "categories"
  archive = "archives"

# ===== Markdown =====
[markup]
  defaultMarkdownHandler = "goldmark"

  [markup.goldmark.extensions]
    definitionList = true
    footnote = true
    linkify = true
    strikethrough = true
    table = true
    taskList = true
    typographer = true

  [markup.goldmark.parser]
    attribute = true          # 支持标题上的 data-icon 等属性
    autoHeadingID = true
    autoHeadingIDType = "github"

  [markup.goldmark.renderer]
    hardWraps = true
    # 示例站需要渲染 Markdown 中的少量原生 HTML；不需要时可改为 false
    unsafe = true
    xHTML = false

  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNoStart = 1
    lineNos = true
    lineNumbersInTable = true
    style = "dracula"
    tabWidth = 4

  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false
