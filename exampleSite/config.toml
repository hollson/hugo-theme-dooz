# ==============================================================
# Hugo 主题 Dooz · 示例站完整配置
# -------------------------------------------------------------
# 用法：复制本文件到你的站点根目录，按需修改即可。
# 说明：所有主题支持的参数都列在这里，可选项以 # 注释形式给出。
# 分组: 1.站点基础, 2.站点参数, 3.多语言, 4.固定链接与分类, 5.Markdown
# ==============================================================


# ==============================================================
# 1. 站点基础（Hugo 顶层配置）
# ==============================================================
baseURL = "https://example.com/"           # 站点根地址，必须以协议开头、以 / 结尾
title = "Dooz·乐园"                         # 站点标题，显示在浏览器标签和 hero 区
theme = "hugo-theme-dooz"                  # 使用的主题目录名（themes/ 下）
locale = "zh-CN"                           # 语言/地区代码(zh-CN / en-US) ，用于日期、数字等
defaultContentLanguage = "zh"              # 默认内容语言（zh/en），用于 i18n 多语言
hasCJKLanguage = true                      # 中日韩语言：影响摘要字数统计等
enableEmoji = true                         # 支持 :emoji: 简写

# 分页：每页显示的文章数
[pagination]
  pagerSize = 10

# 输出格式：home 输出 JSON 供主题内置搜索使用（勿删 JSON）
[outputs]
  home = ["HTML", "RSS", "JSON"]

# ==============================================================
# 2. 站点参数（全部位于 [params] 下，主题读取的核心配置）
# ==============================================================
[params]

  # ------------------------------------------------------------
  # 2.1 站点图标与作者信息
  # ------------------------------------------------------------
  favicon = "assets/favicon.ico"           # 站点图标，留空则用默认 assets/favicon.ico
  author = "Hollson"                       # 作者名，显示在作者卡片、署名等处
  email = "hello@example.com"              # 联系邮箱
  city = "Xian"                            # 所在城市，显示在作者卡片
  avatar = "assets/avatar.jpg"             # 作者头像
  aphorism = "写代码，也写生活"              # 作者格言，显示在作者卡片

  # ------------------------------------------------------------
  # 2.2 站点 Logo（导航 + 页脚）
  # ------------------------------------------------------------
  logo = "assets/logo.png"                 # 图片 Logo，优先级高于 logoText
  logoText = "Dooz"                        # 文字 Logo
  logoFontFamily = 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif'  # 字体栈
  logoFontWeight = 980                     # 字重,即字体加粗
  repo = "https://github.com/hollson/hugo-theme-dooz"   # 导航栏主题按钮

  # 主题色预设：default（墨青） | purple（紫檀） | navy（夜蓝） | terracotta（赤陶） | amber（琥珀）
  # 优先级从高到低：dooz.override.css > themeName > 主题默认色。
  themeName = "default"
  # themeSlim = true      # 精简模式

  # ------------------------------------------------------------
  # 2.3 社交链接（不需要的留空或注释掉即可隐藏对应入口）
  # ------------------------------------------------------------
  github = "https://github.com/hollson"                # GitHub
  csdn = "https://blog.csdn.net/example"               # CSDN
  cnblog = "https://www.cnblogs.com/example/"          # 博客园
  wechat = "assets/dooz_qr.png"                        # 微信二维码图片，配置后显示入口与弹窗

  # ------------------------------------------------------------
  # 2.4 主题公告（主题作者向使用者广播，不是站点公告）
  # ------------------------------------------------------------
  themeAnnouncement = true                # 默认开启；浏览器每天最多检查一次，不阻塞页面
  themeAnnouncementURL = "https://cdn.jsdelivr.net/gh/hollson/hugo-theme-dooz@master/announcement.json"

  # ------------------------------------------------------------
  # 2.5 首页 Hero 与文案
  # ------------------------------------------------------------
  hero = "assets/hero.jpg"                             # Hero 背景图
  slogan = "分享点滴心得，温暖每一段探索之路。"             # 首页副标题
  timeOfMonth = "2006年1月"                            # 日期显示格式（月）
  timeOfDay = "2006年1月2日"                           # 日期显示格式（日）

  # ------------------------------------------------------------
  # 2.6 功能开关
  # ------------------------------------------------------------
  # 侧边栏位置：left / right，默认 left
  # sidebarPosition = "right"                            # 站点默认；文章 front matter 可单独覆盖

  # 侧边栏模块：featured / recent / categories / tags / archives / toc / related(即series，相关文章) / recommended(推荐阅读)
  sidebarHome = ["featured", "categories", "tags"]
  sidebarArticle = ["toc", "related", "recommended", "categories", "tags"]
  sidebarTags = ["categories", "archives"]
  sidebarArchives = ["categories", "tags"]

  # 文章目录显示层级：支持 "H1"~"H6" 或 1~6；
  # 如 ["H2","H3"] 只显示二、三级标题；只写 ["H3"] 会自动带上其上级。
  tocLevels = ["H2","H3"]

  # 相关文章数量（widget-related），默认 10
  # related_content_limit = 10

  # Mermaid 图表：全局开启写 true；也可只在文章 front matter 写 libraries: ["mermaid"]
  # mermaid = true
  # mermaidTheme = "default"               # 可选，Mermaid 主题名

  # KaTeX 数学公式：全局开启写 true；也可只在文章 front matter 写 math=true
  # math = true

  # ------------------------------------------------------------
  # 2.7 页脚
  # ------------------------------------------------------------
  footerTagline = "代码是手艺，笔记是章法。"             # 页脚标语

  # 版权主体（公司/个人名），显示在版权行；不配置默认 Mafool
  copyright = "Mafool科技"

  # 备案号（显示在页脚，链接到工信部）：国内站点按需填写
  icp = "京ICP证000000号"

  # 页脚构建信息（支持 Markdown 链接）
  footerCredit = "由 [Hugo](https://gohugo.io) 与 [Dooz](https://github.com/hollson/hugo-theme-dooz) 构建"

  # 页脚社交入口：必须显式配置，未配置则显示 social1/social2 占位
  footerSocial = [
    { name = "GitHub", url = "https://github.com/example" },
    { name = "博客园", url = "https://www.cnblogs.com/example/" },
    { name = "CSDN", url = "https://blog.csdn.net/example" },
  ]

  # 页脚链接分组：每组有 title，items 为 name/url 数组。
  # 不配置时页脚显示 link1/link2 等演示文字；配置后覆盖为下面的真实分组。
  footerGroups = [
    { title = "技术社区", items = [
      { name = "GitHub", url = "https://github.com" },
      { name = "Stack Overflow", url = "https://stackoverflow.com" },
      { name = "掘金", url = "https://juejin.cn" },
    ]},
    { title = "前沿技术", items = [
      { name = "Hugging Face", url = "https://huggingface.co" },
      { name = "PyTorch", url = "https://pytorch.org" },
      { name = "Kubernetes", url = "https://kubernetes.io" },
    ]},
  ]

  # ------------------------------------------------------------
  # 2.8 SEO
  # ------------------------------------------------------------
  homeTitle = "一个简洁、优雅、灵活的 Hugo 主题"                   # 首页浏览器标题后缀
  keywords = "Hugo,主题,博客,程序员,静态站点" # 全站默认关键词
  description = "Dooz 是一个简洁优雅的 Hugo 主题，内置搜索、代码块工具条、文章目录和响应式布局。"  # 全站默认描述

  # ------------------------------------------------------------
  # 2.9 评论（Giscus / Waline 二选一；账号和 ID 先留空）
  # ------------------------------------------------------------
  [params.comments]
    provider = "giscus"                     # none / giscus / waline

    [params.comments.giscus]
      repo = ""                             # 例如 "owner/repo"，仓库必须公开
      repoId = ""                           # 在 giscus.app 配置页生成
      category = "Comments"                 # GitHub Discussions 分类名
      categoryId = ""                       # 在 giscus.app 配置页生成
      mapping = "pathname"                  # pathname / url / title / og:title
      strict = "0"                          # 1 表示只匹配精确路径
      reactionsEnabled = "1"                # 是否显示表情回应
      emitMetadata = "0"
      inputPosition = "top"                 # top / bottom
      theme = "preferred_color_scheme"      # light / dark / preferred_color_scheme
      lang = "zh-CN"

    # [params.comments.waline]
    #   serverURL = ""                        # 部署 Waline 后填写，例如 https://comments.example.com
    #   lang = "zh-CN"                        # 界面语言
    #   login = "disable"                     # disable 允许匿名评论；enable 强制登录

  # ------------------------------------------------------------
  # 2.10 站点统计（国内 + 国外，账号留空则不加载）
  # 国内：百度统计（tongji.baidu.com）
  # 国外：Google Analytics 4（analytics.google.com）
  # 两套数据分别统计，不合并；本地 localhost 预览会自动跳过
  # 两者都默认使用 Cookie；面向欧盟等地区时请自行配置隐私同意
  # ------------------------------------------------------------
  [params.analytics]
    enable = true                           # 总开关；没有填写任何 ID 时不会发请求
    baidu_site_id = ""                      # 百度统计站点 ID；留空不加载
    google_measurement_id = ""              # GA4 Measurement ID，如 G-XXXXXXXXXX；留空不加载


# ==============================================================
# 3. 多语言（可选）
# --------------------------------------------------------------
# 需要多语言时启用下面的结构，并把 defaultContentLanguage 改为主语言。
# i18n/zh.toml、i18n/en.toml 已内置，模板文案会自动跟随语言切换。
# ==============================================================
# [languages.zh]
#   title = "我的中文站"
#   languageName = "Chinese"
#   weight = 1
# [languages.en]
#   title = "My English Site"
#   languageName = "English"
#   weight = 2


# ==============================================================
# 4. 固定链接与分类体系
# ==============================================================
[permalinks]
  post = "/post/:slug/"                    # 文章 URL 结构；也可在文章 front matter 用 url 覆盖

[taxonomies]
  tag = "tags"                             # 标签
  category = "categories"                  # 分类
  archive = "archives"                     # 归档


# ==============================================================
# 5. Markdown 渲染（Goldmark）
# ==============================================================
[markup]
  defaultMarkdownHandler = "goldmark"

  [markup.goldmark.extensions]
    definitionList = true
    footnote = true
    linkify = true
    strikethrough = true
    table = true
    taskList = true
    typographer = true

    # 数学公式分隔符（配合 KaTeX）
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)'], ['$', '$']]

  [markup.goldmark.parser]
    attribute = true                       # 支持标题属性，如 ## 概述 {data-icon="book"}
    autoHeadingID = true                   # 自动生成标题锚点
    autoHeadingIDType = "github"

  [markup.goldmark.renderer]
    hardWraps = true                       # 单个换行渲染为 <br>
    # 示例站需要在 Markdown 中渲染少量原生 HTML（如 <br/>、<img>）；不需要可改为 false
    unsafe = true
    xHTML = false

  # 代码高亮
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNoStart = 1
    lineNos = true
    lineNumbersInTable = true
    style = "dracula"
    tabWidth = 4

  # 文章目录（主题另用 params.tocLevels 控制显示层级）
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false
