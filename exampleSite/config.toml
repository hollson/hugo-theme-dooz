# ===== 站点基础 =====
baseURL = "https://example.com/"
title = "Mafool's Blog"
theme = "hugo-theme-dooz"
locale = "zh-CN"
defaultContentLanguage = "zh"
hasCJKLanguage = true
enableEmoji = true
copyright = "MIT Licensed"

# 分页
[pagination]
  pagerSize = 10

# 首页生成 JSON，供主题内置搜索使用
[outputs]
  home = ["HTML", "RSS", "JSON"]

# ===== 主题参数 =====
[params]
  # 作者信息：替换成你自己的信息即可
  author = "Hollson"
  email = "hello@example.com"
  city = "Xian"
  avatar = "assets/avatar.jpg"
  aphorism = "写代码，也写生活"

  # 站点 Logo：文字和字体都可以在这里配置
  logoText = "Mafool"
  logoFontFamily = '"Fraunces", "Bodoni 72", Didot, Georgia, "Times New Roman", serif'
  logoFontWeight = 700
  # 可选：引入在线字体；留空则使用系统字体
  logoFontUrl = ""

  # 社交链接：不需要的留空或删除即可
  github = "https://github.com/example"
  csdn = "https://blog.csdn.net/example"
  cnblog = "https://www.cnblogs.com/example/"
  # 微信二维码是可选能力；示例站不放置二维码
  # wechat = "assets/wechat.png"

  # 主题仓库地址，用于导航栏的 GitHub 按钮
  repo = "https://github.com/hollson/hugo-theme-dooz"

  # 公告（支持 Markdown）
  noticeEnable = true
  notice = "📢 &nbsp; **[Dooz](https://github.com/hollson/hugo-theme-dooz)** 主题更新啦, 喜欢的话欢迎点个 Star 支持一下。 [更新日志...](https://github.com/hollson/hugo-theme-dooz/releases)"

  # 首页 Hero 与文案
  hero = "assets/hero.jpg"
  slogan = "分享点滴心得，温暖每一段探索之路。"
  timeOfMonth = "2006年1月"
  timeOfDay = "2006年1月2日"

  # 分享 / 搜索 / 代码复制开关
  openShare = true
  openSearch = true
  openCodeCopy = true

  # 打赏：true 时文章页底部显示赞赏入口
  reward = true
  rewardTitle = "真诚赞赏，手留余香"
  rewardPrompt = "嗯，我的梦想是被读者的稿费包养~"

  # 页脚
  footerTagline = "代码是手艺，笔记是章法。"

  # SEO
  homeTitle = "Mafool · 程序员博客主题"
  keywords = "Hugo,主题,博客,程序员,静态站点"
  description = "Mafool 是一个简洁优雅的 Hugo 主题，内置搜索、代码块工具条、文章目录和响应式布局。"

# 需要多语言站点时，启用下面的结构并把 defaultContentLanguage 改为主语言；
# i18n/zh.toml、i18n/en.toml 已内置，模板文案会自动跟随语言切换。
# [languages.zh]
#   title = "我的中文站"
#   languageName = "Chinese"
#   weight = 1
# [languages.en]
#   title = "My English Site"
#   languageName = "English"
#   weight = 2

# 固定链接
[permalinks]
  post = "/:year/:month/:title"

# 分类体系
[taxonomies]
  tag = "tags"
  category = "categories"
  archive = "archives"

# ===== Markdown =====
[markup]
  defaultMarkdownHandler = "goldmark"

  [markup.goldmark.extensions]
    definitionList = true
    footnote = true
    linkify = true
    strikethrough = true
    table = true
    taskList = true
    typographer = true

  [markup.goldmark.parser]
    attribute = true          # 支持标题上的 data-icon 等属性
    autoHeadingID = true
    autoHeadingIDType = "github"

  [markup.goldmark.renderer]
    hardWraps = true
    # 示例站需要渲染 Markdown 中的少量原生 HTML；不需要时可改为 false
    unsafe = true
    xHTML = false

  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNoStart = 1
    lineNos = true
    lineNumbersInTable = true
    style = "dracula"
    tabWidth = 4

  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false
