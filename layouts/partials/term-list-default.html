<div class="container">
    <main id="main" class="section tag-page page-main">
        {{ if .Data.Terms }}
        <div class="tag-intro">
            <span class="tag-eyebrow">{{ .Type }}</span>
            <p class="tag-summary">{{ if eq .Type "categories" }}{{ i18n "categoryCount" (len .Data.Terms) }}{{ else }}{{ i18n "termCount" (len .Data.Terms) }}{{ end }}</p>
        </div>
        <div class="tag-cloud">
            {{ range .Data.Terms.ByCount }}
            <a class="tag-pill" href="{{ .Page.RelPermalink }}">
                <span class="tag-pill-name">{{ .Page.Title }}</span>
                <span class="tag-pill-count">{{ .Count }}</span>
            </a>
            {{ end }}
        </div>
        {{ else }}
        <p class="tag-summary">{{ i18n "noContent" }}</p>
        {{ end }}
    </main>
</div>
