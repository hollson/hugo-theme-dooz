<div class="card widget-category">
    <div class="card-content">
        <h2 class="title is-6">{{i18n "categories"}}</h2>
        <ul class="widget-list">
            {{ range .Site.Taxonomies.categories }}
            <li class="widget-list-item">
                <a class="widget-list-link" href="{{ "categories" | relURL }}/{{ .Page.Title | urlize }}">
                    <span class="widget-list-label">{{ .Page.Title }}</span>
                    <span class="widget-list-count">{{ i18n "postCountShort" .Count }}</span>
                </a>
            </li>
            {{ end }}
        </ul>
    </div>
</div>
<br />
