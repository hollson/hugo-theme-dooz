{{- $themeSlim := false -}}
{{- if isset .Site.Params "themeslim" -}}{{- $themeSlim = .Site.Params.themeSlim -}}{{- end -}}
<header id="header" class="site-header header-home">
    {{ partial "nav" . }}
    {{ if not $themeSlim }}
    <section id="hero" class="hero is-info is-medium hero-gradient site-hero" style="--hero-image: url('{{ .Site.Params.Hero | relURL }}');">
        <div class="container has-text-centered">
            <h1 id="hero_title" class="title" style="font-size: 58px;">{{ .Site.Title }}</h1>
            <h2 id="hero_subtitle" class="subtitle">
                {{.Site.Params.Slogan}}
            </h2>
        </div>
    </section>
    {{ end }}
</header>
