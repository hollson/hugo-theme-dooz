<div class="card widget-recent">
    <div class="card-content">
        <h2 class="title is-6">{{i18n "recentPosts"}}</h2>
        {{ range first 5 (where .Site.RegularPages "Section" "post").ByPublishDate.Reverse }}
        <article class="media">
            <div class="media-content">
                <div class="content">
                    <a href="{{ .Permalink | relURL }}" title="{{ .Title }}">{{ .Title }}</a>
                </div>
            </div>
        </article>
        {{ end }}
    </div>
</div>
<br>
