<div class="search" data-index="{{ "index.json" | relURL }}">
    <div class="field">
        <p class="control has-icons-left">
            <input class="input is-rounded is-middle" id="search-input" type="text"
                placeholder='{{i18n "forSearch"}}' autocomplete="off" aria-label='{{i18n "forSearch"}}'>
            <span class="icon is-small is-left">
                {{ partial "icon" (dict "name" "search" "size" 14) }}
            </span>
        </p>
    </div>
    <div class="search-results" id="search-results" role="listbox"></div>
</div>
