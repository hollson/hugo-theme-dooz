{{- $config := .Site.Params.comments.giscus -}}
{{- if and $config.repo $config.repoId $config.categoryId -}}
<section class="comments comments-giscus" id="comments">
    <h3 class="title is-6">{{ i18n "comments" }}</h3>
    <script src="https://giscus.app/client.js"
        data-repo="{{ $config.repo }}"
        data-repo-id="{{ $config.repoId }}"
        data-category="{{ $config.category | default "Comments" }}"
        data-category-id="{{ $config.categoryId }}"
        data-mapping="{{ $config.mapping | default "pathname" }}"
        data-strict="{{ $config.strict | default "0" }}"
        data-reactions-enabled="{{ $config.reactionsEnabled | default "1" }}"
        data-emit-metadata="{{ $config.emitMetadata | default "0" }}"
        data-input-position="{{ $config.inputPosition | default "top" }}"
        data-theme="{{ $config.theme | default "preferred_color_scheme" }}"
        data-lang="{{ $config.lang | default "zh-CN" }}"
        data-loading="lazy"
        crossorigin="anonymous"
        async>
    </script>
</section>
{{- else -}}
<section class="comments comments-giscus" id="comments">
    <h3 class="title is-6">{{ i18n "comments" }}</h3>
    <div class="giscus-mock" aria-label="Giscus 评论预览">
        <div class="giscus-mock-head">
            <span class="giscus-mock-count">0 条评论</span>
            <button type="button" class="giscus-mock-login">使用 GitHub 登录</button>
        </div>
        <div class="giscus-mock-editor">
            <div class="giscus-mock-avatar">G</div>
            <div class="giscus-mock-input">
                <div class="giscus-mock-placeholder">登录后参与评论…</div>
                <div class="giscus-mock-actions">
                    <span>支持 Markdown</span>
                    <button type="button" disabled>评论</button>
                </div>
            </div>
        </div>
        <div class="giscus-mock-comment">
            <div class="giscus-mock-avatar is-user">A</div>
            <div class="giscus-mock-comment-body">
                <div class="giscus-mock-comment-meta">
                    <strong>示例用户</strong>
                    <span>刚刚</span>
                </div>
                <p>这是一条示例评论，用来预览评论区的排版效果。</p>
            </div>
        </div>
        <p class="comments-placeholder">预览效果：填写 Giscus 配置后显示真实评论。</p>
    </div>
</section>
{{- end -}}
