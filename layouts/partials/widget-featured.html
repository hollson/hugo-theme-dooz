{{- $posts := where .Site.RegularPages "Section" "post" -}}
{{- $featured := where $posts "Params.featured" true -}}
{{- with $featured -}}
<div class="box widget-featured">
    <h2 class="title is-6">{{ i18n "featured" }}</h2>
    {{ range first 5 (partial "sorted-pages.html" $featured) }}
    <article class="media">
        <div class="media-content">
            <div class="content">
                <a href="{{ .RelPermalink }}" title="{{ .LinkTitle }}">{{ .LinkTitle }}</a>
            </div>
        </div>
    </article>
    {{ end }}
</div>
{{- end -}}
