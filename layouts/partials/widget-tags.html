<div class="card">
    <div class="card-content">
        <h2 class="title is-6">{{i18n "tags"}}</h2>
        <div>
            {{ range $name, $taxonomy := .Site.Taxonomies.tags }}
            <span class="tag is-size-7 sidebar-tag">
                <svg class="sidebar-tag-icon" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58s1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41s-.23-1.06-.59-1.42zM5.5 8C4.67 8 4 7.33 4 6.5S4.67 5 5.5 5 7 5.67 7 6.5 6.33 8 5.5 8z" fill="currentColor"/>
                </svg>
                <a href="{{ "tags" | relURL }}/{{ $name | urlize }}">{{ $name }}</a>
            </span>
            {{ end }}
        </div>
    </div>
</div>
<br>
