<!DOCTYPE html>
<html lang="{{ $.Site.Language.Locale | default "en" }}">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!--SEO Meta-->
    <title>{{ .Site.Title }} | {{if .IsHome}}{{ $.Site.Params.homeTitle }}{{else}}{{.Title}}{{end}}</title>
    <meta name="keywords"
        content='{{ if .Keywords }}{{delimit .Keywords ","}}{{ else }}{{.Site.Params.keywords}}{{ end }}'>
    <meta name="description" content="{{if .IsHome}}{{ $.Site.Params.description }}{{else}}{{.Description}}{{end}}" />

    <!--Open Graph / Twitter-->
    <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
    <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
    <meta property="og:description" content="{{ if .IsHome }}{{ .Site.Params.description }}{{ else }}{{ .Description }}{{ end }}">
    <meta property="og:url" content="{{ .Permalink }}">
    {{ with .Params.images }}<meta property="og:image" content="{{ index . 0 | absURL }}">{{ end }}
    {{ with .Params.image }}<meta property="og:image" content="{{ . | absURL }}">{{ end }}
    <meta name="twitter:card" content="summary_large_image">

    <!-- 百度资源提交校验 https://ziyuan.baidu.com/site/siteverify -->
    <meta name="baidu-site-verification" content="v9szEmQLra" />
    <meta name="360-site-verification" content="d8e961f98fb655e4b8cf9439cfd9ac7f" />
    <meta name="sogou_site_verification" content="40NC9EdZDC" />
    <meta name="shenma-site-verification" content="3200e3042e92157713a3b0aceeecb20a_1586020187" />
    <meta name="google-site-verification" content="r8987bkunZHJeKut3ocu5NIJ5QEu53NA6Q_r7RrZ46c" />
    <meta name="msvalidate.01" content="893A2865ABC54AC2782D118536831056" />

    <!--Head Common-->
    <link rel="shortcut icon" href="{{ "img/res/favicon.ico" | relURL }}">
    <link rel="stylesheet" href="{{ "css/bulma.min.css" | relURL }}" />

    <link rel="stylesheet" href="{{ "css/dooz.blog.css" | relURL }}" />
    <link rel="stylesheet" href="{{ "css/theme.css" | relURL }}?v={{ now.Unix }}" />

    <!-- share -->
    {{if .Site.Params.OpenShare}}
    <link rel="stylesheet" href="/css/share.min.css" />
    <script src="/js/share.js"></script>
    <script defer src='{{ "js/search.js" | relURL }}'></script>
    <script defer src='{{ "js/copy-code.js" | relURL }}'></script>
    {{end}}

    <!--Head Extend-->
    {{ block "headex" . }}{{ end }}

    <!-- 远程 Open Sans 已停用，改用系统字体栈（theme.css） -->
    <script src={{"js/dooz.blog.js"|relURL}}></script>
</head>

<body{{ block "bodyclass" . }}{{ end }}>
    <!--Header-->
    {{ block "header" . }}
    <!-- { partial "header" . }} -->
    {{ end }}

    <!--Main Container-->
    <div class="container">
        <div class="section">
            {{ block "main" . }}{{ end }}
        </div>
    </div>

    <!--Footer-->
    {{ partial "footer" . }}

    <!--Foot Extend：Some references that must be placed at the end, such as the reward script-->
    {{ block "footex" . }}{{ end }}
</body>

</html>
